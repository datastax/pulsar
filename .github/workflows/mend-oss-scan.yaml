name: Mend CLI OSS

on:
  push:
    branches:
      - 4.0_ds
      - 3.1_ds
    tags: [ '**' ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 4.0_ds
      - 3.1_ds
  workflow_dispatch:

concurrency:
  group: mend-oss-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MEND_PROJECTNAME: ${{ vars.MEND_PROJECTNAME }}
  MEND_URL: ${{ vars.MEND_URL }}
  MEND_REPORT: "mend-results.json"
  MEND_REPO: ${{ github.event.repository.name }}

jobs:
  mend-cli-scan:
    name: Mend SCA Scan
    runs-on: ubuntu-latest
    # Fork PRs have no access to secrets, so the scan cannot authenticate; skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Findings only produce warnings; this job never blocks PRs or releases.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tune Runner VM
        uses: ./.github/actions/tune-runner-vm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      # Install all modules so the local Maven repository is fully populated for
      # Mend's dependency resolution. Exclude distribution/io and distribution/offloaders
      # to avoid the .nar assembly step that fails when DnarPluginPhase=none is set.
      - name: Build (skip tests)
        run: mvn -B -ntp clean install -DskipTests -Dspotbugs.skip=true -Dlicense.skip=true -Dcheckstyle.skip=true -Drat.skip=true -DskipDocker=true -DnarPluginPhase=none -pl '!distribution/io,!distribution/offloaders'

      - name: Download Mend CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://downloads.mend.io/cli/linux_amd64/mend -o ./mend
          chmod +x ./mend

      # The full scan output is written to a file only. The per-vulnerability table
      # (library, CVE ID, fix) is filtered out of the job log because logs are public
      # on public repositories. Review full results in the Mend platform.

      # On tagged releases: scan and update the Mend platform project.
      - name: Run Mend dep scan (release — update platform)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MEND_PRODUCTNAME: ${{ secrets.MEND_PRODUCTNAME }}
          MEND_ORGNAME: ${{ vars.MEND_ORGNAME }}
          MEND_EMAIL: ${{ secrets.MEND_EMAIL }}
          MEND_API_KEY: ${{ secrets.MEND_API_KEY }}
          MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
        run: |
          rc=0
          ./mend dep --dir . \
            --scope "$MEND_ORGNAME//$MEND_PRODUCTNAME//$MEND_PROJECTNAME - $MEND_REPO" \
            --export-results "$MEND_REPORT" \
            --non-interactive \
            --update > mend-output.txt 2>&1 || rc=$?
          grep -vE '^[|+]' mend-output.txt || true
          exit "$rc"

      # On pushes and PRs: scan and report only (no platform update).
      - name: Run Mend dep scan (non-release — report only)
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          MEND_PRODUCTNAME: ${{ secrets.MEND_PRODUCTNAME }}
          MEND_ORGNAME: ${{ vars.MEND_ORGNAME }}
          MEND_EMAIL: ${{ secrets.MEND_EMAIL }}
          MEND_API_KEY: ${{ secrets.MEND_API_KEY }}
          MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
        run: |
          rc=0
          ./mend dep --dir . \
            --scope "$MEND_ORGNAME//$MEND_PRODUCTNAME//$MEND_PROJECTNAME - $MEND_REPO" \
            --export-results "$MEND_REPORT" \
            --non-interactive > mend-output.txt 2>&1 || rc=$?
          grep -vE '^[|+]' mend-output.txt || true
          exit "$rc"

      # Mend CLI exits 0 even on findings; parse the output file and warn on Critical/High.
      - name: Warn on Critical/High findings
        if: always()
        run: |
          [ -f mend-output.txt ] || { echo "::warning::Mend scan output not found."; exit 0; }
          summary=$(grep 'Detected .* vulnerabilities' mend-output.txt || true)
          critical=$(echo "$summary" | sed 's/.*(\([0-9]*\) Critical.*/\1/' | grep -E '^[0-9]+$' || echo 0)
          high=$(echo "$summary"     | sed 's/.*(\([0-9]* Critical, \)\([0-9]*\) High.*/\2/' | grep -E '^[0-9]+$' || echo 0)
          if [ "$((${critical:-0} + ${high:-0}))" -gt 0 ]; then
            echo "::warning::Mend SCA found Critical/High vulnerabilities — review them in the Mend platform. These must be remediated before this step is re-enabled as a hard gate."
          fi

      # Only upload the report for private repositories. On a public repository,
      # artifacts are downloadable by anyone and would expose unpatched vulnerabilities.
      - name: Upload Mend scan report
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: mend-scan-report
          path: |
            ${{ env.MEND_REPORT }}
            mend-output.txt
